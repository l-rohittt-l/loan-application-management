[pytest]
# Run from the backend/ folder:  pytest tests/phase1 -v
# pythonpath puts backend/ on Python's path so `import app` works from tests/phase1/ (T-37).
pythonpath = .
testpaths = tests
# The trainer's run command uses -k "P1"; keeping IDs in docstrings and file names makes that work.
addopts = -p no:cacheprovider
